# Builds src/ and publishes the result to GitHub Pages, served under
# marcusklaas.nl/gainz. The compiled js/ is deliberately not committed — this is
# the only thing that produces it, so what is live always matches src/.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The same job a pull request runs, called rather than copied so the two can
  # never drift apart. A red build or a failing test stops the deploy below.
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Copied file by file rather than uploading the repo, so the planning
      # notes and sources stay out of the served site.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html style.css manifest.webmanifest sw.js _site/
          cp -r js vendor icons _site/
          # Type declarations and source maps are build-time only. The maps
          # would point at sources that are not served anyway, and the service
          # worker should not be caching either.
          find _site -name '*.d.ts' -o -name '*.map' | xargs -r rm
          # Names the cache after this commit, so deploying replaces the old one
          # instead of serving stale modules forever.
          sed -i "s/__VERSION__/${GITHUB_SHA::12}/" _site/sw.js
          grep -q "gainz-${GITHUB_SHA::12}" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
