# The gate. Runs on its own for every pull request, and is called by Deploy
# before it publishes — one definition of "passing", so what reaches the site
# has cleared exactly what a pull request has to clear.
name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A superseded push has nothing worth finishing. Keyed per ref so pull requests
# never cancel each other, and never cancel main.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node-version is a different question from the action's own runtime: it
      # is what the code is tested on. 24 because that is what it is developed
      # on, and a gate that runs an older Node than the machine writing the code
      # is checking the wrong thing — it passes what is about to break and fails
      # what already works.
      #
      # `cache` is set explicitly, so the automatic package-manager detection
      # added in setup-node v5 has nothing left to decide.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The app build, which is what type-checks the DOM-facing half of src/.
      # The test build compiles only what the tests import, so this is not
      # redundant with it — between them every file in src/ is checked.
      - run: npm run build

      - run: npm test
