# The gate. Runs on its own for every pull request, and is called by Deploy
# before it publishes — one definition of "passing", so what reaches the site
# has cleared exactly what a pull request has to clear.
name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A superseded push has nothing worth finishing. Keyed per ref so pull requests
# never cancel each other, and never cancel main.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app build, which is what type-checks the DOM-facing half of src/.
      # The test build compiles only what the tests import, so this is not
      # redundant with it — between them every file in src/ is checked.
      - run: npm run build

      - run: npm test
